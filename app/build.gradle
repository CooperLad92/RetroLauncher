plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cooperlad.retrolauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cooperlad.retrolauncher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs straight away.
            // Swap in your own keystore before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No external dependencies: plain Android framework only.
